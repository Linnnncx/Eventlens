name: eventlens

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  backend:
    image: eventlens-backend:prod
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ${ENV_FILE:-.env.production}
    expose:
      - "8000"
    volumes:
      - ./backend/data:/app/data
    restart: unless-stopped
    init: true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 30s
    logging: *default-logging

  news-scheduler:
    image: eventlens-backend:prod
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["python", "-m", "scripts.news_scheduler"]
    env_file:
      - ${ENV_FILE:-.env.production}
    volumes:
      - ./backend/data:/app/data
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    init: true
    healthcheck:
      test: ["CMD", "python", "-m", "scripts.news_scheduler", "--healthcheck"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 90s
    logging: *default-logging

  market-scheduler:
    image: eventlens-backend:prod
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["python", "-m", "scripts.market_scheduler"]
    env_file:
      - ${ENV_FILE:-.env.production}
    volumes:
      - ./backend/data:/app/data
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    init: true
    healthcheck:
      test: ["CMD", "python", "-m", "scripts.market_scheduler", "--healthcheck"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 90s
    logging: *default-logging

  frontend:
    image: eventlens-frontend:prod
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    init: true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/api/health"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 15s
    logging: *default-logging
